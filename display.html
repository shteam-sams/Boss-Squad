    .map(lines => {

  V.force = null; V.caption = null;
  V.title = { text: C.name, sub: `Special: ${sp.name}`, col: C.color, t0: now(), dur: 2.6 }; await sleep(2700);
  V.reelDone = true;
}

/* =================================================================
   Stream music: MP3s in the music/ folder next to this page
   ================================================================= */
const MUSIC = { dir: 'music/', files: { intro: 'intro', training: 'training', boss: 'boss', atom: 'boss-atom', microbe: 'boss-microbe', hole: 'boss-blackhole',
  chemistry: 'chemistry', biology: 'biology', physics: 'physics', astronomy: 'astronomy', winning: 'winning', losing: 'losing', victory: 'victory' } };
const StreamMusic = (() => {
  const decks = [new Audio(), new Audio()]; let cur = 0, mode = null, track = null, blocked = false, firstBoss = true, fades = [null, null];
  const vol = () => (G && G.music ? G.music.vol : .5);
  decks.forEach((a, i) => { a.preload = 'auto';
    a.addEventListener('ended', () => { if (i === cur && mode) next(); });
    a.addEventListener('error', () => { if (i === cur && mode) setTimeout(() => { if (i === cur && mode) next(true); }, 1500); }); });
  function fade(i, to, ms, then) {
    clearInterval(fades[i]); const a = decks[i], from = a.volume, t0 = Date.now();
    fades[i] = setInterval(() => { const k = Math.min(1, (Date.now() - t0) / ms); a.volume = Math.max(0, Math.min(1, from + (to - from) * k)); if (k >= 1) { clearInterval(fades[i]); then && then(); } }, 40);
  }
  function play(name, loop) {
    if (!MUSIC.files[name]) return;
    const old = cur; cur = 1 - cur; const a = decks[cur]; track = name;
    a.src = MUSIC.dir + MUSIC.files[name] + '.mp3'; a.loop = !!loop; a.volume = 0; a.currentTime = 0;
    a.play().then(() => { blocked = false; fade(cur, vol(), 1500); }).catch(() => { blocked = true; });
    if (!decks[old].paused) fade(old, 0, 1500, () => decks[old].pause());
  }
  function stop() { track = null; decks.forEach((a, i) => { if (!a.paused) fade(i, 0, 1200, () => a.pause()); }); }
  function next(err) {
    if (mode === 'neutral') {   // the boss's own song first, then shuffle the generic tracks
      const kind = G.boss && G.boss.kind;
      if (firstBoss && kind && !err) { firstBoss = false; return play(kind); }
      const pool = ['boss', 'chemistry', 'biology', 'physics', 'astronomy', kind].filter(n => n && n !== track);
      return play(pool[Math.floor(Math.random() * pool.length)]);
    }
    if (mode === 'victory') { mode = 'intro'; return play('intro', true); }
    if (mode) play(mode, true);
  }
  return {
    set(m) { if (m === mode) return; const prev = mode; mode = m;
      if (!m) return stop();
      if (m === 'neutral') { if (prev === null || prev === 'intro' || prev === 'victory') firstBoss = true; return next(); }
      play(m, m !== 'victory'); },
    newBoss() { firstBoss = true; if (mode === 'neutral') next(); },
    volume() { const a = decks[cur]; if (!a.paused) { clearInterval(fades[cur]); a.volume = vol(); } },
    unlock() { if (blocked && mode) { blocked = false; const a = decks[cur]; a.play().then(() => fade(cur, vol(), 800)).catch(() => { blocked = true; }); } },
    get blocked() { return blocked; }, get track() { return track; }, get mode() { return mode; },
  };
})();
// Which music fits the moment
function musicMode() {
  if (!G.music || !G.music.on || DEMO) return null;
  switch (G.phase) {
    case 'lobby': return 'intro';
    case 'training': return null;                 // students hear music on their own devices
    case 'victory': return 'victory';
    case 'defeat': return 'losing';
  }
  if (!G.boss) return 'intro';
  return G.mood === 'winning' ? 'winning' : G.mood === 'losing' ? 'losing' : 'neutral';
}
// After each question: is the class cruising, in trouble, or somewhere in between?
function updateMood(acc) {
  const live = playerList().filter(p => p.connected); if (!live.length) return;
  if (acc == null) acc = V.accHist && V.accHist.length ? V.accHist.pop() : .7;
  const hp = live.reduce((s, p) => s + (p.alive ? p.hp / p.max : 0), 0) / live.length, down = live.filter(p => !p.alive).length / live.length;
  V.accHist = (V.accHist || []).concat(acc).slice(-2); const avg = V.accHist.reduce((a, b) => a + b, 0) / V.accHist.length;
  G.mood = (down >= .25 || hp < .4 || avg < .45) ? 'losing' : (avg >= .8 && hp >= .55) ? 'winning' : 'neutral';
}
function drawSoundPrompt() {
  if (!StreamMusic.blocked || !StreamMusic.mode) return;
  ug.font = `700 26px ${FONT}`; const t = '🔇 Click the game screen once to turn on music'; const w = ug.measureText(t).width + 40;
  ug.fillStyle = 'rgba(20,18,31,.88)'; rrect(ug, 1920 - w - 40, 1080 - 76, w, 50, 25); ug.fill();
  ug.fillStyle = COL.yellow; ug.textAlign = 'left'; ug.textBaseline = 'middle'; ug.fillText(t, 1920 - w - 20, 1080 - 51);
}
document.addEventListener('pointerdown', () => { StreamMusic.unlock(); SFX.unlockCtx && SFX.unlockCtx(); });

/* ---------- main loop ---------- */
function fitStage() { const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('stage').style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`; }
addEventListener('resize', fitStage); fitStage();
let lastT = now();
function warmSprites() { for (let n = 0; n < 2 && warmQ.length; n++) { const [p, ps] = warmQ.shift(); if (G.players[p.id] === p) spriteOf(p, ps); } }
function frame() {
  warmSprites();
  if (G) { if (!G.music) G.music = { on: true, vol: .5 }; StreamMusic.set(musicMode()); }
  const t = now(), dt = Math.min(.05, t - lastT); lastT = t;
  const sh = V.shakeT && t - V.shakeT < .5 ? (1 - (t - V.shakeT) / .5) * 3 : 0;
  wg.setTransform(3, 0, 0, 3, Math.round((Math.random() - .5) * sh) * 3, Math.round((Math.random() - .5) * sh) * 3);   // world is drawn in 480×270 units at 3× detail
  drawBg(t);
  if (G.phase !== 'lobby' && G.phase !== 'training') drawBoss(t);
  if (G.phase !== 'training') drawPlayers(t);
  stepAnims(t);
  stepFx(t, dt);
  wg.setTransform(1, 0, 0, 1, 0, 0);
  ug.clearRect(0, 0, 1920, 1080);
  if (G.phase !== 'training') drawLabels(); else drawLeaderboard(t);
  drawBossBar(t); drawJoinChip(); drawLobby(t); if (!drawSpotlight(t)) drawQuestion(t); drawTrainingUI(t); drawFloaters(t); drawCampBoss(t); drawPhoenixBanner(t); drawDefeat(t); drawDemoCaption(t); drawShowTitle(t); drawSoundPrompt(); drawFeed(); drawVictory(t); drawNet();
  requestAnimationFrame(frame);
}
layout(); requestAnimationFrame(frame);
if (DEMO) (params.has('showcase') ? (CLASSES[params.get('showcase')] ? () => runReel(params.get('showcase')) : runShowcase) : runDemo)();
else {
  startPeer();
  if (G.sheet && G.sheet.url) loadSheet(G.sheet.url); else if (CONFIG.sheetUrl) loadSheet(CONFIG.sheetUrl);
}

/* ---------- keyboard (OBS "Interact" window) ---------- */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), m = { l: 'lobby', b: 'battle', n: 'ask', c: 'close', h: 'restore' }[k];
  if (m) runCmd({ c: m, nonce: uid() });
});
</script>
