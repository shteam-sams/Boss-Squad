<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join · Boss Squad</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140A30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<script>
/* SCIENCE SQUAD — STUDENT PAGE. Host this file online (Netlify Drop, GitHub Pages…)
   and put its address in display.html → CONFIG.joinUrl.
   If you self-host a PeerJS server, set it here too. */
const PEER_SERVER = null;   // e.g. { host: 'peer.example.com', port: 443, path: '/', secure: true }
</script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #140A30; --bg2: #24124F; --panel: #1D1A2B; --raise: #2A2640; --line: #3A3552;
    --text: #F6F4EF; --muted: #B4AECB; --purple: #6A3DE8; --pink: #FF3E9A; --lime: #A6E22E; --yellow: #FFD23F; --blue: #2F80FF; --ink: #14121F;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(120% 70% at 50% 0%, var(--bg2), var(--bg) 70%) fixed; color: var(--text);
         font: 16px/1.35 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
         padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  main { max-width: 520px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { margin: 6px 0 0; font-size: 34px; font-weight: 800; font-variation-settings: "wdth" 80; line-height: 1; }
  .lead { margin: 0; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
  label.f { display: grid; gap: 6px; font-weight: 700; font-size: 14px; color: var(--muted); }
  input { font: inherit; font-size: 20px; font-weight: 700; color: var(--text); background: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
  input#room { text-transform: uppercase; letter-spacing: .2em; font-size: 26px; }
  input:focus { outline: none; border-color: var(--yellow); }
  button { font: inherit; font-weight: 800; color: var(--text); background: var(--raise); border: 0; border-radius: 14px; padding: 12px 14px; min-height: 48px; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  .ans.mine:disabled { opacity: 1; }
  html { background: var(--bg); }
  .go { background: var(--yellow); color: var(--ink); font-size: 20px; }
  .look { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: start; }
  .look canvas { width: 96px; height: 120px; image-rendering: pixelated; background: radial-gradient(circle at 50% 70%, #3B2A7A, transparent 70%); border-radius: 14px; }
  .stack2 { display: grid; gap: 10px; }
  .lbl { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .sw { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw button { width: 32px; height: 32px; min-height: 0; padding: 0; border-radius: 50%; border: 3px solid transparent; box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }
  .sw button[aria-pressed="true"] { border-color: var(--yellow); }
  .sw button:focus-visible { outline: 3px solid var(--text); outline-offset: 1px; }
  .classes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cls { text-align: left; padding: 10px; border: 2px solid transparent; display: grid; gap: 4px; align-content: start; }
  .cls[aria-pressed="true"] { border-color: var(--c); background: #322C4A; }
  .cls canvas { width: 64px; height: 80px; image-rendering: pixelated; }
  .cls b { color: var(--c); font-size: 18px; }
  .cls small { color: var(--muted); font-weight: 500; font-size: 13px; line-height: 1.3; }
  .row { display: flex; gap: 10px; align-items: center; }
  .msg { min-height: 20px; margin: 0; font-weight: 700; }
  .err { color: var(--pink); }
  .hidden { display: none !important; }
  /* battle */
  .me { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
  .me canvas { width: 64px; height: 80px; image-rendering: pixelated; }
  .bar { height: 14px; background: var(--ink); border-radius: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--lime); border-radius: 8px; transition: width .4s; }
  .pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
  .pips i { height: 12px; border-radius: 3px; background: rgba(255,210,63,.16); }
  .pips i.on { background: var(--yellow); }
  .stat { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 700; margin: 6px 0 3px; }
  .boss { display: grid; gap: 6px; }
  .boss .bar i { background: var(--pink); }
  .q { font-size: 22px; font-weight: 800; line-height: 1.2; margin: 4px 0 12px; }
  .timer { height: 6px; background: var(--ink); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
  .timer i { display: block; height: 100%; background: var(--yellow); }
  .answers { display: grid; gap: 8px; }
  .ans { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; text-align: left; font-size: 18px; padding: 12px; }
  .ans span { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--yellow); display: grid; place-items: center; }
  .ans.mine { background: var(--purple); }
  .ans.right { background: var(--lime); color: var(--ink); }
  .ans.wrong { background: var(--pink); color: var(--ink); }
  .big { font-size: 26px; font-weight: 800; margin: 0 0 4px; }
  .acts { display: grid; gap: 10px; }
  .act { display: grid; gap: 2px; text-align: left; padding: 12px 14px; }
  .act small { font-weight: 600; color: var(--muted); }
  .act.atk { background: var(--pink); color: var(--ink); } .act.atk small { color: #4A1230; }
  .act.heal { background: var(--lime); color: var(--ink); } .act.heal small { color: #2E4410; }
  .act.shield { background: var(--blue); color: var(--ink); } .act.shield small { color: #0E2A5C; }
  .act.k-atk { background: var(--pink); color: var(--ink); } .act.k-atk small { color: #4A1230; }
  .act.k-heal { background: var(--lime); color: var(--ink); } .act.k-heal small { color: #2E4410; }
  .act.k-def { background: var(--blue); color: var(--ink); } .act.k-def small { color: #0E2A5C; }
  .act.k-util { background: var(--yellow); color: var(--ink); } .act.k-util small { color: #5A4500; }
  .act.k-sp { background: linear-gradient(135deg, #6A3DE8, #3B2A7A); color: var(--text); box-shadow: inset 0 0 0 3px var(--yellow); }
  .act.k-sp small { color: #DCD2FF; }
  .cls .role { color: var(--text); font-weight: 700; font-size: 12px; }
  .tm.sel { outline: 3px solid var(--yellow); }
  /* training */
  .mon { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; }
  .mon canvas { width: 72px; height: 63px; image-rendering: pixelated; }
  .hits { display: flex; gap: 5px; margin-top: 6px; } .hits i { flex: 1; height: 12px; border-radius: 3px; background: rgba(246,244,239,.15); } .hits i.on { background: var(--text); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; } .badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--raise); color: var(--muted); }
  .badge.b { background: rgba(47,128,255,.25); color: #BFD6FF; } .badge.y { background: rgba(255,210,63,.2); color: var(--yellow); }
  .ttimer { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-weight: 800; }
  .ttimer b { font-size: 22px; color: var(--yellow); }
  .offer { display: grid; gap: 10px; margin-top: 10px; }
  .up { text-align: left; display: grid; gap: 3px; padding: 12px 14px; border: 2px solid var(--c); background: var(--raise); }
  .up em { font-style: normal; font-size: 12px; font-weight: 800; color: var(--c); }
  .up small { font-weight: 500; color: var(--muted); font-size: 14px; }
  .rollbox { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--raise); font-weight: 800; }
  .team { display: grid; gap: 6px; max-height: 50vh; overflow: auto; }
  .tm { display: grid; grid-template-columns: 1fr 90px; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; }
  .tm .bar { height: 10px; }
  .streak { display: flex; gap: 8px; margin-top: 8px; }
  .streak i { width: 22px; height: 22px; border-radius: 50%; background: rgba(246,244,239,.15); }
  .streak i.on { background: var(--lime); }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); border: 2px solid var(--yellow);
           padding: 10px 16px; border-radius: 14px; font-weight: 800; max-width: 90vw; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .musicrow { display: flex; justify-content: flex-end; margin-bottom: -6px; }
  .mbtn { min-height: 40px; padding: 6px 14px; font-size: 14px; border-radius: 999px; background: var(--raise); }
  .mbtn.off { color: var(--muted); } .mbtn.tap { background: var(--yellow); color: var(--ink); }
  .banner { background: var(--pink); color: var(--ink); font-weight: 800; padding: 8px 12px; border-radius: 12px; text-align: center; }

  /* pictures */
  .pic { display: grid; place-items: center; position: relative; width: 100%; padding: 0; background: #0D0B16; border: 0; border-radius: 14px; overflow: hidden; min-height: 0; font-weight: 600; }
  .pic img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .pic.qpic { height: min(38vh, 320px); margin: 0 0 12px; }
  .pic.qpic.small { height: min(24vh, 200px); margin-top: 10px; }
  .pic.choicepic { aspect-ratio: 4 / 3; border-radius: 12px 12px 0 0; }
  .pic.blank { display: block; }
  .zoomhint { position: absolute; right: 8px; bottom: 8px; width: 34px; height: 34px; border-radius: 50%; background: rgba(20,18,31,.8); color: var(--text); display: grid; place-items: center; font-size: 18px; }
  .picmsg { color: var(--muted); font-size: 14px; text-align: center; padding: 12px; line-height: 1.4; }
  .picmsg u { color: var(--yellow); }
  .spin { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .answers.grid { grid-template-columns: 1fr 1fr; }
  .card2 { display: grid; background: var(--raise); border-radius: 14px; overflow: hidden; border: 3px solid transparent; }
  .card2 .ans { border-radius: 0; background: transparent; font-size: 16px; padding: 10px; grid-template-columns: 30px 1fr; }
  .card2 .ans span { width: 30px; height: 30px; }
  .card2.mine { border-color: var(--purple); } .card2.mine .ans { background: var(--purple); }
  .card2.right { border-color: var(--lime); } .card2.right .ans { background: var(--lime); color: var(--ink); }
  .card2.wrong { border-color: var(--pink); } .card2.wrong .ans { background: var(--pink); color: var(--ink); }
  .card2.dim, .ans.dim { opacity: .55; }
  .card2 .ans:disabled { opacity: 1; }
  div.ans { border-radius: 14px; background: var(--raise); font-weight: 800; }
  /* viewer */
  .lb { position: fixed; inset: 0; z-index: 50; background: #08060F; touch-action: none; }
  .lb-stage { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; padding: calc(56px + env(safe-area-inset-top, 0px)) 8px calc(84px + env(safe-area-inset-bottom, 0px)); }
  .lb-img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center center; user-select: none; -webkit-user-drag: none; will-change: transform; }
  .lb-x { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; width: 48px; height: 48px; border-radius: 50%; padding: 0;
          font-size: 22px; background: rgba(246,244,239,.16); color: var(--text); border: 2px solid rgba(246,244,239,.4); }
  .lb-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: center; pointer-events: none; }
  .lb-bar > * { pointer-events: auto; }
  .lb-hint { color: var(--muted); font-size: 13px; font-weight: 600; }
  .lb-choose { width: min(420px, 100%); }
</style>
</head>
<body>
<main id="joinView">
  <div>
    <h1>Join the battle</h1>
    <p class="lead">Pick a class, answer questions to charge energy, then attack the boss or heal your classmates.</p>
  </div>
  <div class="card" style="display:grid;gap:12px">
    <label class="f">Room code <input id="room" maxlength="5" autocomplete="off" autocapitalize="characters" inputmode="text"></label>
    <label class="f">Your name <input id="name" maxlength="16" autocomplete="nickname" placeholder="First name"></label>
  </div>
  <div class="classes" id="classes"></div>
  <div class="card look">
    <canvas id="lookPrev" width="48" height="60" aria-label="Your character"></canvas>
    <div class="stack2">
      <div><p class="lbl">Outfit color</p><div class="sw" id="swMain"></div></div>
      <div><p class="lbl">Accent color</p><div class="sw" id="swAccent"></div></div>
      <div><p class="lbl">Skin tone</p><div class="sw" id="swSkin"></div></div>
      <div><p class="lbl">Hair color</p><div class="sw" id="swHair"></div></div>
      <button id="reroll">New hairstyle</button>
    </div>
  </div>
  <button class="go" id="joinBtn">Join</button>
  <p class="msg err" id="joinMsg"></p>
</main>

<main id="battleView" class="hidden">
  <div class="banner hidden" id="banner">Reconnecting…</div>
  <div class="musicrow hidden" id="musicRow"><button type="button" id="musicBtn" class="mbtn"></button></div>
  <div class="card me">
    <canvas id="meSprite" width="48" height="60"></canvas>
    <div>
      <div class="row" style="justify-content:space-between"><b id="meName" style="font-size:20px"></b><small id="meCls" style="font-weight:700"></small></div>
      <div class="stat"><span>Health</span><span id="hpTxt"></span></div>
      <div class="bar"><i id="hpBar"></i></div>
      <div class="stat"><span id="enLbl">Energy</span><span id="enTxt"></span></div>
      <div class="pips" id="pips"></div>
    </div>
  </div>
  <div class="card boss hidden" id="bossCard">
    <div class="stat" style="margin:0"><b id="bossName" style="color:var(--text);font-size:16px"></b><span id="bossTxt"></span></div>
    <div class="bar"><i id="bossBar"></i></div>
  </div>
  <div class="card" id="mainCard"></div>
  <div class="card hidden" id="actCard">
    <div class="acts">
      <button class="act atk" id="atkBtn"></button>
      <button class="act heal" id="healBtn"></button>
      <button class="act shield hidden" id="shieldBtn"></button>
    </div>
    <div class="acts hidden" id="kitBtns"></div>
    <div class="team hidden" id="teamList" style="margin-top:10px"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
/* ---------- shared with display.html ---------- */
const CLASSES = {
  chemist:    { name: 'Chemist',    subject: 'Science', role: 'Damage',      color: '#FF3E9A', maxHp: 100, attack: { name: 'Flask lob', cost: 3, dmg: 28 },        heal: { name: 'Antidote', cost: 2, amt: 15 },      blurb: 'Big, risky hits' },
  biologist:  { name: 'Biologist',  subject: 'Science', role: 'Healer',      color: '#A6E22E', maxHp: 100, attack: { name: 'Spore cloud', cost: 3, dmg: 14 },      heal: { name: 'Cell regrowth', cost: 2, amt: 35 }, blurb: 'Keeps everyone alive' },
  physicist:  { name: 'Physicist',  subject: 'Science', role: 'Tank',        color: '#2F80FF', maxHp: 140, attack: { name: 'Momentum strike', cost: 3, dmg: 20 },  heal: { name: 'Force field', cost: 2, amt: 20 },   blurb: 'Blocks the big attacks' },
  astronomer: { name: 'Astronomer', subject: 'Science', role: 'Burst',       color: '#FFD23F', maxHp: 90,  attack: { name: 'Meteor shower', cost: 5, dmg: 52 },    heal: { name: 'Starlight', cost: 2, amt: 15 },     blurb: 'Slow to charge, huge hits' },
  spartan:    { name: 'Spartan',    subject: 'History', role: 'Tank',        color: '#E2453C', maxHp: 150, attack: { name: 'Spear thrust', cost: 3, dmg: 18 },     heal: { name: 'Brace', cost: 2, amt: 15 },         blurb: 'Takes hits for others' },
  politician: { name: 'Politician', subject: 'History', role: 'Support',     color: '#9C7BFF', maxHp: 100, attack: { name: 'Fiery speech', cost: 3, dmg: 14 },     heal: { name: 'Morale boost', cost: 2, amt: 25 },  blurb: 'Shares energy around' },
  reader:     { name: 'Reader',     subject: 'English', role: 'Defender',    color: '#FF8A3D', maxHp: 110, attack: { name: 'Paper cut', cost: 3, dmg: 16 },        heal: { name: 'Deep breath', cost: 2, amt: 20 },   blurb: 'Sees the boss coming' },
  writer:     { name: 'Writer',     subject: 'English', role: 'Damage + heal', color: '#FF8FC4', maxHp: 95, attack: { name: 'Ink splash', cost: 3, dmg: 24 },      heal: { name: 'Happy ending', cost: 2, amt: 25 },  blurb: 'Rewrites bad rounds' },
  geometer:   { name: 'Geometer',   subject: 'Math',    role: 'Support',     color: '#56E2E1', maxHp: 105, attack: { name: 'Sharp angle', cost: 3, dmg: 18 },      heal: { name: 'Perfect fit', cost: 2, amt: 20 },   blurb: 'Bounces attacks back' },
  calculus:   { name: 'Calculus',   subject: 'Math',    role: 'Late damage', color: '#8FC0FF', maxHp: 95,  attack: { name: 'Integral beam', cost: 4, dmg: 40 },    heal: { name: 'Limit', cost: 2, amt: 15 },         blurb: 'Grows stronger every round' },
  sams:       { name: 'The Sams',   subject: 'Teacher', role: 'Teacher', color: '#2FB5B3', maxHp: 120, attack: { name: 'Update grades', cost: 3, dmg: 22 },  heal: { name: 'Extra credit', cost: 2, amt: 25 },  blurb: 'Only one per game' },
  engineer:   { name: 'Engineer',   subject: 'Building', role: 'Rescue tank', color: '#FFB020', maxHp: 140, attack: { name: 'Hammer drop', cost: 3, dmg: 20 },     heal: { name: 'First aid', cost: 2, amt: 25 },     blurb: 'Gets fallen friends back up' },
};
// Boss-fight abilities. Each class has three basics (no two classes share more than one) and one special.
const ABIL = {
  boost:    { cost: 2, target: null,    fam: 'atk',  desc: v => `Adds ${v}% to the next team strike` },
  strike:   { cost: 3, target: null,    fam: 'atk',  desc: () => 'Hits the boss right now' },
  energize: { cost: 2, target: 'other', fam: 'util', desc: () => 'Gives a classmate 2 energy' },
  heal:     { cost: 2, target: 'hurt',  fam: 'heal', desc: v => `Heals a classmate +${v}` },
  gheal:    { cost: 3, target: null,    fam: 'heal', desc: v => `Heals everyone +${v}` },
  steady:   { cost: 2, target: 'alive', fam: 'def',  desc: () => 'A classmate’s next wrong answer costs half' },
  shield:   { cost: 3, target: 'alive', fam: 'def',  desc: v => `Shields a classmate for ${v}` },
  gshield:  { cost: 4, target: null,    fam: 'def',  desc: v => `Shields everyone for ${v}` },
  weaken:   { cost: 3, target: null,    fam: 'def',  desc: v => `The boss’s next special attack does ${v}% less` },
};
const SPECIALS = {
  overload:  { name: 'Overload',      cost: 4, cd: 3, target: null,    desc: 'A huge boost to the next team strike, but it costs you 15 health' },
  symbiosis: { name: 'Symbiosis',     cost: 5, cd: 4, target: null,    desc: 'Everyone heals 8 after each of the next 3 questions' },
  inertia:   { name: 'Inertia field', cost: 5, cd: 3, target: null,    desc: 'Blocks all damage from the boss’s next special attack' },
  meteor:    { name: 'Meteor storm',  cost: 5, cd: 3, target: null,    desc: 'Big damage to the boss right now' },
  guard:     { name: 'Guard',         cost: 4, cd: 3, target: 'other', desc: 'Take half the damage aimed at a classmate for 2 questions' },
  rally:     { name: 'Rally speech',  cost: 4, cd: 3, target: null,    desc: '+2 energy to the 3 classmates with the least' },
  readahead: { name: 'Read ahead',    cost: 4, cd: 2, target: null,    desc: 'The boss needs 2 higher on its next roll' },
  plottwist: { name: 'Plot twist',    cost: 4, cd: 3, target: null,    desc: 'The next team strike hits as if at least half the class got it right' },
  reflect:   { name: 'Reflection',    cost: 4, cd: 3, target: null,    desc: 'The next special attack does half damage and bounces back at the boss' },
  integrate: { name: 'Integrate',     cost: 5, cd: 3, target: null,    desc: 'Damage that grows with every question of the fight' },
  mute:      { name: 'Mute class',    cost: 5, cd: 3, target: null,    desc: 'Hits the boss and mutes it: no special attack next question' },
  rebuild:   { name: 'Rebuild',       cost: 5, cd: 4, target: 'down',  desc: 'Brings a knocked-out classmate back at 30% health' },
};
const KIT = {
  chemist:    { basics: [['boost', 'Exothermic mix', 10], ['strike', 'Flask lob', 1.1], ['energize', 'Catalyst']], special: 'overload' },
  biologist:  { basics: [['heal', 'Cell regrowth', 35], ['gheal', 'Spore bloom', 12], ['steady', 'Antibodies']], special: 'symbiosis' },
  physicist:  { basics: [['shield', 'Force field', 45], ['gshield', 'Magnetic dome', 15], ['weaken', 'Dampener', 40]], special: 'inertia' },
  astronomer: { basics: [['boost', 'Alignment', 12], ['gheal', 'Starlight', 8], ['weaken', 'Eclipse', 30]], special: 'meteor' },

  else { px(7, 0, lt, 2, 2); px(5, 2, lt, 6, 2); px(4, 4, col, 8, 4); px(3, 6, col, 10, 5); px(5, 11, col, 6, 2); px(6, 12, dk, 4, 1); eyes(5, 6); }
}
const UPCOL = { attack: 'var(--pink)', support: 'var(--lime)', utility: 'var(--blue)' };
const UPLBL = { attack: 'Attack', support: 'Support', utility: 'Utility' };
let tKey = '', tEnds = 0, koEnds = 0, nextEnds = 0;
const fmtT = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function renderTraining(s) {
  const T = s.train || {}, m = s.me, mc = $('mainCard'), q = T.q;
  $('actCard').classList.add('hidden'); $('bossCard').classList.add('hidden');

  const key = T.offer ? 'o' + T.offer.map(o => o.id).join() : T.ko ? 'k' : q ? q.id + ':' + q.pick + ':' + (T.mon && T.mon.got) : 'w';
  if (key !== tKey || !mc.querySelector('.ttimer')) {

    } else {

        const info = document.createElement('div');
        info.innerHTML = `<b style="font-size:18px"></b><div class="lead" style="font-size:14px">Level ${M.lvl} monster · ${M.got} of ${M.need} hits</div><div class="hits">${Array.from({ length: M.need }, (_, i) => `<i class="${i < M.got ? 'on' : ''}"></i>`).join('')}</div>`;

        if (q.pick !== null) {

          res.style.color = q.ok ? 'var(--lime)' : 'var(--pink)'; wrap.append(res);
        }
        if (q.text) { const t = document.createElement('div'); t.className = 'q'; t.textContent = q.text; wrap.append(t); }
        if (q.img) wrap.append(picSlot(q.img, q.pick === null ? 'qpic' : 'qpic small', src => Viewer.open(src), 'Enlarge the question picture'));
        wrap.append(q.pick === null ? choiceList(qq, 'ask', null, i => send({ t: 'tanswer', qid: q.id, choice: i })) : choiceList(qq, 'show', { pick: q.pick }));

        mc.append(wrap);

    }

function tickTraining() {

  const k = document.getElementById('koTime'); if (k) k.textContent = Math.max(0, Math.ceil((koEnds - Date.now()) / 1000)) + 's';

setInterval(tickTraining, 250);

/* ---------- render battle ---------- */
let lastSprite = '', timerRAF = null, healOpen = false, qEnds = 0, lastQ = '';
function send(m) { if (conn && conn.open) conn.send(m); }
function choiceList(q, mode, r, onPick) {

    const cls = mode === 'show' ? (i === q.correct ? ' right' : r && r.pick === i ? ' wrong' : ' dim') : (q.mine === i ? ' mine' : '');
    const pick = () => { if (mode !== 'ask' || q.mine !== null || !q.inRoster) return; q.mine = i; if (onPick) onPick(i); else send({ t: 'answer', qid: q.id, choice: i }); lastQ = ''; render(); };

      const card = document.createElement('div'); card.className = 'card2' + cls;
      if (c.img) card.append(picSlot(c.img, 'choicepic', src => Viewer.open(src, mode === 'ask' && q.mine === null && q.inRoster ? { choose: { label: `Choose ${letter}`, fn: pick } } : {}), `Enlarge picture for choice ${letter}`));
      else { const blank = document.createElement('div'); blank.className = 'pic choicepic blank'; card.append(blank); }
      const b = document.createElement('button'); b.type = 'button'; b.className = 'ans' + cls;
      b.innerHTML = `<span>${letter}</span>`; b.append(c.t || (mode === 'ask' ? `Choose ${letter}` : ''));
      b.disabled = mode !== 'ask' || q.mine !== null || !q.inRoster; b.onclick = pick;
      card.append(b); box.append(card);
    } else {
      const b = document.createElement(mode === 'ask' ? 'button' : 'div'); b.className = 'ans' + cls; if (mode === 'ask') b.type = 'button';
      b.innerHTML = `<span>${letter}</span>`; b.append(c.t);
      if (mode === 'ask') { b.disabled = q.mine !== null || !q.inRoster; b.onclick = pick; }

}
function render() {

  $('hpBar').style.background = m.hp / m.max > .5 ? 'var(--lime)' : m.hp / m.max > .25 ? 'var(--yellow)' : 'var(--pink)';
  const training = s.mode === 'campaign' && s.camp && s.camp.stage === 'training';
  $('enLbl').textContent = training ? 'Level' : 'Energy';
  $('enTxt').textContent = training ? `${m.lvl || 1}` + (m.ups && m.ups.length ? ` · ${m.ups.length} upgrade${m.ups.length === 1 ? '' : 's'}` : '') : `${m.energy} / ${maxE}`;
  $('pips').style.display = training ? 'none' : '';

  const pips = $('pips');

    $('bossTxt').textContent = `${s.boss.hp} / ${s.boss.max}`; $('bossBar').style.width = (100 * s.boss.hp / s.boss.max) + '%'; }
  else $('bossCard').classList.add('hidden');
  (s.pre || []).forEach(k => loadPic(k));
  Music.set(training ? 'training' : null);
  $('musicRow').classList.toggle('hidden', !training);
  if (training) { renderTraining(s); return; }

  const mc = $('mainCard'), q = s.q;
  if (s.phase === 'question' && q) {
    const key = q.id + ':' + q.mine;

      big.style.color = r && r.ok === true ? 'var(--lime)' : r && r.ok === false ? 'var(--pink)' : 'var(--text)';

let teamKind = 'heal', kitKey = '';
function renderKit(s) {

  const key = JSON.stringify([K, m.energy]); if (key === kitKey) return; kitKey = key;
  const box = $('kitBtns'); box.innerHTML = '';

    const b = document.createElement('button'); b.type = 'button'; b.className = 'act k-' + a.fam;
    b.innerHTML = '<span></span><small></small>';
    b.querySelector('span').textContent = (a.sp ? '★ ' : '') + a.name;
    b.querySelector('small').textContent = `${a.desc} · ${a.cost} energy` + (a.sp && a.cd > 0 ? ` · ready in ${a.cd} question${a.cd === 1 ? '' : 's'}` : '');
    b.disabled = m.energy < a.cost || (a.sp && a.cd > 0);

function renderTeam() {
  const A = typeof teamKind === 'object' ? teamKind : null;

    const box = $('teamList'), m = state.me; box.innerHTML = '';
    const head = document.createElement('p'); head.className = 'lead'; head.style.margin = '0 0 4px'; head.textContent = `${A.name}: pick a classmate`; box.append(head);

      const b = document.createElement('button'); b.className = 'tm'; const pct = t.hp / t.max;

  head.textContent = teamKind === 'shield' ? 'Who should get a shield?' : 'Who should you heal?'; box.append(head);
  const team = state.team.filter(t => t.alive).sort((a, b) => a.hp / a.max - b.hp / b.max);
  team.forEach(t => {
    const b = document.createElement('button'); b.className = 'tm';
    const pct = t.hp / t.max;
    b.innerHTML = `<span></span><div class="bar"><i style="width:${pct * 100}%;background:${pct > .5 ? 'var(--lime)' : pct > .25 ? 'var(--yellow)' : 'var(--pink)'}"></i></div>`;
    b.firstChild.textContent = (t.id === m.id ? 'You' : t.name) + ` · ${t.hp}/${t.max}` + (t.sh ? ` · shield ${t.sh}` : '');
    b.disabled = (teamKind === 'heal' && t.hp >= t.max) || m.energy < cost;
    b.onclick = () => { send({ t: 'act', kind: teamKind, target: t.id }); healOpen = false; box.classList.add('hidden'); };
    box.append(b);

}
$('musicBtn').onclick = () => { const st = Music.state; if (st.on && !st.running) Music.unlock(); else Music.toggle(); };
$('atkBtn').onclick = () => send({ t: 'act', kind: state && state.mode === 'campaign' ? 'power' : 'attack' });
function openTeam(kind) { const same = healOpen && (teamKind === kind || (typeof kind === 'object' && typeof teamKind === 'object' && teamKind.id === kind.id && !!teamKind.sp === !!kind.sp));
  healOpen = !same; teamKind = kind; $('teamList').classList.toggle('hidden', !healOpen); if (healOpen) renderTeam(); }
$('healBtn').onclick = () => openTeam('heal');
$('shieldBtn').onclick = () => openTeam('shield');
function tick() {

  const step = () => { const bar = document.getElementById('tbar'); if (!bar || !state || !state.q) return;
    const rem = Math.max(0, qEnds - Date.now()); bar.style.width = (100 * rem / state.q.dur) + '%'; bar.style.background = rem / state.q.dur > .3 ? 'var(--yellow)' : 'var(--pink)';
    if (rem > 0) timerRAF = requestAnimationFrame(step); };
  step();
}

// rejoin automatically after a refresh
if (sessionStorage.getItem('sciquest:joined') && sessionStorage.getItem('sciquest:joined') === me.room && me.name && (!params.get('room') || params.get('room').toUpperCase() === me.room)) {
  $('joinMsg').textContent = 'Rejoining…'; connect();
}
